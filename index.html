 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Olá Hillary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 4px;
    }

    p {
      color: #94a3b8;
      margin-top: 0;
    }

    .caixa {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      margin-top: 16px;
    }

    input {
      padding: 10px;
      font-size: 1.1rem;
      border-radius: 8px;
      border: none;
      width: 140px;
      text-align: center;
    }

    button {
      padding: 10px 18px;
      font-size: 1.1rem;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      cursor: pointer;
      margin-left: 8px;
    }

    button:hover {
      background: #7dd3fc;
    }

    #resultado {
      margin-top: 20px;
      font-size: 1.5rem;
      min-height: 2rem;
    }
  </style>
</head>
<body>

  <h1>Olá, Hillary! 👋</h1>
  <p>Fiz uma calculadora pra você: de Celsius para Kelvin.</p>

  <div class="caixa">
    <input type="number" id="celsius" placeholder="Graus °C">
    <button onclick="converter()">Converter</button>
    <div id="resultado"></div>
  </div>

  <script>
    function converter() {
      // Pega o número que a pessoa digitou
      var celsius = parseFloat(document.getElementById("celsius").value);
      var resultado = document.getElementById("resultado");

      // Se não digitou nada válido, avisa
      if (isNaN(celsius)) {
        resultado.textContent = "Digite um número primeiro 🙂";
        return;
      }

      // Fórmula: K = °C + 273,15
      var kelvin = celsius + 273.15;

      // O zero absoluto é -273,15 °C, abaixo disso não existe
      if (kelvin < 0) {
        resultado.textContent = "Impossível! Abaixo do zero absoluto 🥶";
        return;
      }

      resultado.textContent = celsius + " °C = " + kelvin.toFixed(2) + " K";
    }
  </script>

</body>
</html>
